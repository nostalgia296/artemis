name: Android

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Android NDK
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q ndk.zip -d "$HOME"
          mv "$HOME/android-ndk-r29" "$HOME/ndk"
          echo "ANDROID_NDK_HOME=$HOME/ndk" >> "$GITHUB_ENV"
          echo "$HOME/ndk" >> "$GITHUB_PATH"

      - name: Build JNI libraries
        run: bash build-android.sh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: pfs-android
          path: android/app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: pfs-*
